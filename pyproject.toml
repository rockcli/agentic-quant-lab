[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-quant-lab"
version = "0.1.0"
description = "Knowledge-grounded agentic quantitative strategy research and anti-overfitting validation framework (RAG + LLM loop + CSCV/PBO, DSR, WFA, Regime, Embargo)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "rockcli"},
]
keywords = [
    "quantitative-finance",
    "agentic-ai",
    "rag",
    "backtesting",
    "walk-forward-analysis",
    "overfitting-detection",
    "pbo",
    "cscv",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "numpy>=1.26",
    "polars>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
rag = [
    "sentence-transformers>=3.0",
]
optimize = [
    "optuna>=3.6",
]

[project.scripts]
agentic-quant-rag = "agentic_quant.ai.rag.run_rag_demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers"
pythonpath = ["src", "."]
